# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
# Stacked PRs (based on another PR's branch) skip CI; a PR runs once it
# targets main, including when it is retargeted there (edited, base
# changed).  Other PR edits start a run whose jobs are all skipped.
on:
  push:
    branches: [main, master]
  # PR checks run only when a reviewer approves with the phrase
  # "ready to be merged" (pushes to a PR branch no longer start CI).
  pull_request_review:
    types: [submitted]
  # Maintainers can also start PR checks by commenting "/ci" on the PR.
  issue_comment:
    types: [created]
  # Run by hand on any branch: Actions tab -> Run workflow, or `gh workflow run`.
  workflow_dispatch:

name: R-CMD-check.yaml

permissions: read-all

# Auto-cancel superseded in-progress runs for the same ref so stale runs don't
# pile up and starve the runner pool.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.ref }}${{ github.event.action == 'edited' && !github.event.changes.base && format('-{0}', github.run_id) || '' }}${{ ((github.event_name == 'pull_request_review' && !(github.event.review.state == 'approved' && contains(github.event.review.body, 'ready to be merged'))) || (github.event_name == 'issue_comment' && !(github.event.issue.pull_request && startsWith(github.event.comment.body, '/ci') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)))) && format('-noop-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    if: ((github.event_name != 'pull_request' && github.event_name != 'pull_request_review' && github.event_name != 'issue_comment') || github.event.action != 'edited' || github.event.changes.base) && ((github.event_name != 'pull_request_review' && github.event_name != 'issue_comment') || (github.event_name == 'pull_request_review' && github.event.review.state == 'approved' && contains(github.event.review.body, 'ready to be merged') && contains(fromJSON('["main","master"]'), github.event.pull_request.base.ref)) || (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/ci') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)))
    # statuses: write lets a /ci run report back to the PR
    permissions:
      actions: read
      checks: read
      contents: read
      deployments: read
      discussions: read
      issues: read
      packages: read
      pages: read
      pull-requests: read
      repository-projects: read
      security-events: read
      statuses: write
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }}${{ matrix.config.shard && format(' shard {0}', matrix.config.shard) || '' }})

    strategy:
      fail-fast: false
      matrix:
        config:
          # ubuntu-release carries the test signal: it runs the FULL essential
          # subset (27m, Status: OK).  Every other entry sets cranTests, running
          # only the CRAN-visible subset (see NLMIXR2EST_TEST_CRAN_ONLY in
          # tests/testthat.R) while still doing a complete build + R CMD check --
          # install, examples with --run-donttest, Rd, and compiled-code checks all
          # still run, which is what these entries are actually here to catch.
          #
          # They cannot run the full suite: a long job on a hosted runner gets
          # RECLAIMED mid-test-run, which surfaces as "exit code 143 / The runner
          # has received a shutdown signal" (confirmed in the ubuntu-devel log) or,
          # when the runner is lost outright, as a failure with no log and no
          # artifact at all.  macOS/Windows spend ~5h45m in `checking tests` against
          # ~19m on Ubuntu; devel and oldrel-1 were killed at 4h33m and after a
          # check phase that swung between 1h12m and 4h02m across runs.  Before
          # this, all four gave no signal whatsoever.
          - {os: macos-latest,   r: 'release', cranTests: true}
          - {os: windows-latest, r: 'release', cranTests: true}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release', cranTests: true}
          - {os: ubuntu-latest,   r: 'oldrel-1', cranTests: true}
          # The full essential subset is SHARDED across three jobs.  One job is a
          # lottery: the identical step took 27m on one runner and was reclaimed at
          # 4h15m ("exit code 143") on another.  Every file still runs -- the shards
          # partition the subset exactly -- but each job stays short enough to
          # finish.  See NLMIXR2EST_TEST_SHARD in tests/testthat.R.
          - {os: ubuntu-latest,   r: 'release', shard: '1/3'}
          - {os: ubuntu-latest,   r: 'release', shard: '2/3'}
          - {os: ubuntu-latest,   r: 'release', shard: '3/3'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      NLMIXR2EST_TEST_CRAN_ONLY: ${{ matrix.config.cranTests && 'true' || 'false' }}
      NLMIXR2EST_TEST_SHARD: ${{ matrix.config.shard || '' }}

    steps:
      - name: Report /ci run to the PR (pending)
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        env:
          CI_CONTEXT: ${{ matrix.config.os }} (${{ matrix.config.r }}${{ matrix.config.shard && format(' shard {0}', matrix.config.shard) || '' }})
        with:
          script: |
            const pr = await github.rest.pulls.get({ ...context.repo, pull_number: context.issue.number });
            core.exportVariable('CI_PR_HEAD_SHA', pr.data.head.sha);
            await github.rest.repos.createCommitStatus({ ...context.repo, sha: pr.data.head.sha,
              state: 'pending', context: process.env.CI_CONTEXT, description: '/ci run in progress',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });

      - name: Install deps on MacOS
        if: runner.os == 'macOS'
        run: |
          brew install gettext
        shell: bash

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/merge', github.event.issue.number) || '' }}

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # cache-version 3: the qs2/stringfish source pins are gone (see below),
          # so the cached dependency set changed.
          cache-version: 3
          extra-packages: |
            any::rcmdcheck
            nlmixr2/lbfgsb3c
            nlmixr2/dparser-R
            nlmixr2/n1qn1c
            nlmixr2/lotri
            nlmixr2/rxode2ll
            nlmixr2/rxode2
            nlmixr2/PreciseSums
            qs=?ignore
            rstan=?ignore
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          # upload-results is left at its default: the action already uploads the
          # .Rcheck directory on failure ('false' only suppresses it for SUCCESSFUL
          # runs).  Note neither that nor the console log survives a job that loses
          # its runner -- which is why the 6h-cancelled jobs reported nothing.
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

      - name: Report /ci run to the PR (result)
        if: always() && github.event_name == 'issue_comment' && env.CI_PR_HEAD_SHA != ''
        uses: actions/github-script@v7
        env:
          CI_CONTEXT: ${{ matrix.config.os }} (${{ matrix.config.r }}${{ matrix.config.shard && format(' shard {0}', matrix.config.shard) || '' }})
          CI_JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const s = process.env.CI_JOB_STATUS;
            const state = s === 'success' ? 'success' : s === 'failure' ? 'failure' : 'error';
            await github.rest.repos.createCommitStatus({ ...context.repo, sha: process.env.CI_PR_HEAD_SHA,
              state, context: process.env.CI_CONTEXT, description: `/ci run: ${s}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });
